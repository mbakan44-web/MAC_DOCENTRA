<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="refresh" content="3; url=https://github.com/mbakan44-web/DocentraWebsite/releases/download/v1.0.0/Docentra_Setup_v1.0.5.exe">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 24px auto;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-direct {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .btn-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            background: linear-gradient(135deg, #3b82f6, #2563eb);

        .note {

</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Docentra PDF Suite</h1>
        <p>Your download is starting automatically.<br>If it does not begin in a few seconds, click the button below:</p>
        <a id="downloadLink" href="https://github.com/mbakan44-web/DocentraWebsite/releases/download/v1.0.0/Docentra_Setup_v1.0.5.exe" class="btn-direct">
            Download Now (v1.0.5)
        </a>
        <div class="note">Verified Safe &amp; 100% Offline • Windows 10 / 11</div>
    </div>

    <script>
        (async function() {
            var fallbackUrl = "https://github.com/mbakan44-web/DocentraWebsite/releases/download/v1.0.0/Docentra_Setup_v1.0.5.exe";
            var btn = document.getElementById("downloadLink");

            try {
                // version.txt dosyasından güncel sürüm ve indirme linkini dinamik al
                var res = await fetch("/version.txt?t=" + Date.now());
                if (res.ok) {
                    var data = await res.text();
                    var lines = data.trim().split("\n");
                    var version = (lines[0] || "").trim();
                    var url = (lines[1] || "").trim();

                    if (url && url.startsWith("http")) {
                        if (btn) {
                            btn.href = url;
                            if (version) btn.innerText = "Download Now (v" + version + ")";
                        }
                        // Doğrudan indirmeyi başlat
                        window.location.replace(url);
                        return;
                    }
                }
            } catch (err) {
                console.warn("Could not fetch version.txt:", err);
            }

            // Fallback
            if (btn) btn.href = fallbackUrl;
            window.location.replace(fallbackUrl);
        })();
    </script>
</body>
</html>
